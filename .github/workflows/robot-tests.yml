name: Robot Framework CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  Run-Test:
    runs-on: ubuntu-20.04

    steps:
      # 1) Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Cache pip like in the article
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/robot/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # 3) Set up Python and install Robot deps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/robot/requirements.txt

      # 4) Set up Node and frontend (your project specific part)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Start frontend
        working-directory: client
        run: |
          npm run dev:renderer -- --host 0.0.0.0 --port 5173 &
          echo "Waiting for frontend to be ready..."
          for i in {1..60}; do
            if curl -sS http://localhost:5173/ > /dev/null; then
              echo "Frontend is responding"
              break
            fi
            echo "Still waiting..."
            sleep 2
          done

      # 5) Set up Chrome for Selenium / Robot
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true

      # 6) Run Robot tests using "python -m robot" like the template
      - name: Run Robot Framework tests
        working-directory: tests/robot
        run: |
          python -m robot -d output --variable BROWSER:headlesschrome tests

      # 7) Publish test results (Robot output dir)
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: tests/robot/output/
