name: Robot Framework CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  Run-Test:
    runs-on: ubuntu-latest

    env:
      DISPLAY: :99

    steps:
      # 1) Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/robot/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # 3) Set up Python and install Robot deps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/robot/requirements.txt

      # 4) Set up Node and frontend
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Start frontend
        working-directory: client
        run: |
          npm run dev:renderer -- --host 0.0.0.0 --port 5173 &
          echo "Waiting for frontend to be ready..."
          for i in {1..60}; do
            if curl -sS http://localhost:5173/ > /dev/null; then
              echo "Frontend is responding"
              break
            fi
            echo "Still waiting..."
            sleep 2
          done

      # 5) Install and start Xvfb for GUI apps
      - name: Start virtual display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          xvfb \
          libgtk-3-0 \
          libnss3 \
          libxss1 \
          libasound2t64 \
          libx11-xcb1
          Xvfb :99 -screen 0 1920x1080x24 &
      - name: Debug running processes
        run: |
          ps aux | grep electron || true

      # 7) Set up Chrome for Selenium / Robot
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true

      - name: Capture frontend HTML for debugging
        run: |
          curl -s http://localhost:5173/login > /tmp/rendered.html || echo "Curl failed"
          head -n 30 /tmp/rendered.html

      - name: Upload loaded page HTML
        uses: actions/upload-artifact@v4
        with:
          name: loaded-login-page
          path: /tmp/rendered.html

      # 8) Run Robot tests
      - name: Run Robot Framework tests
        working-directory: tests/robot
        run: |
          python -m robot -d output --variable BROWSER:headlesschrome tests

      # 9) Publish test results
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: tests/robot/output/
